<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BoardLite</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="mark">BoardLite</p>
        <h1 id="report-name">Untitled</h1>
      </div>
      <div class="actions">
        <label class="file edit">Open files<input id="file" type="file" multiple accept=".csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" /></label>
        <button id="reload" type="button">Reload URLs</button>
        <button id="share" class="edit" type="button">Copy link</button>
        <button id="keep" type="button" hidden>Save a copy</button>
        <button id="export" type="button">Export Excel</button>
        <label class="edit">Reports<select id="reports"></select></label>
        <button id="new-report" class="edit" type="button">New report</button>
        <button id="undo" type="button">Undo</button>
      </div>
    </header>
    <details class="top restore edit">
      <summary>Restore layout</summary>
      <label class="file">Choose a report JSON<input id="import" type="file" accept="application/json,.json" /></label>
    </details>
    <p id="status" role="status"></p>
    <p id="path" class="top path">Open a file, then add a chart from its columns. Open a second file only when the chart needs a name that lives in that file.</p>
    <p id="drop" class="drop">Drop CSV or Excel files here.</p>
    <section id="model"></section>
    <section id="columns"></section>
    <form id="page-filters"></form>
    <form id="add-tile"></form>
    <p id="tile-hint"></p>
    <main id="canvas"></main>
    <dialog id="confirm">
      <p id="confirm-text">Replace the current report with this file?</p>
      <form method="dialog">
        <button value="cancel">Cancel</button>
        <button value="ok">Replace</button>
      </form>
    </dialog>
    <footer class="top credit">
      <a href="https://majidrajpar.github.io/portfolio_my/">Majid Mumtaz</a>
      <a href="mailto:majidrajpar@gmail.com">majidrajpar@gmail.com</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
